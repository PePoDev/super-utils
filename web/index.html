<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>super-utils Debugger</title>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 2em; }
        .output { background: #222; color: #eee; padding: 1em; border-radius: 5px; margin-top: 1em; white-space: pre-wrap; }
        .section { margin-bottom: 2em; }
        label { display: block; margin-bottom: 0.5em; }
        input, textarea, select { width: 100%; margin-bottom: 1em; }
        button { padding: 0.5em 1em; }
    </style>
</head>
<body>
    <h1>super-utils Debugger</h1>
    <div class="section">
        <h2>Tool Launcher</h2>
        <form id="tool-form" hx-post="/api/shell" hx-target="#tool-output" hx-swap="innerHTML">
            <label for="tool">Select Tool:</label>
            <select id="tool" name="tool" onchange="updateCommandExample()">
                <optgroup label="Network & Diagnostic Tools">
                    <option value="apache2-utils">apache2-utils (ab, htpasswd)</option>
                    <option value="arping">arping</option>
                    <option value="bind-tools">bind-tools (dig, nslookup)</option>
                    <option value="bird">bird (BGP routing)</option>
                    <option value="bridge-utils">bridge-utils (brctl)</option>
                    <option value="busybox">busybox</option>
                    <option value="busybox-extras">busybox-extras</option>
                    <option value="calicoctl">calicoctl</option>
                    <option value="conntrack-tools">conntrack-tools</option>
                    <option value="ctop">ctop (container monitoring)</option>
                    <option value="curl">curl</option>
                    <option value="dhcping">dhcping</option>
                    <option value="drill">drill (DNS lookup)</option>
                    <option value="ethtool">ethtool</option>
                    <option value="fping">fping</option>
                    <option value="httpie">httpie (http)</option>
                    <option value="iftop">iftop</option>
                    <option value="iperf">iperf</option>
                    <option value="iperf3">iperf3</option>
                    <option value="iproute2">iproute2 (ip, ss)</option>
                    <option value="ipset">ipset</option>
                    <option value="iptables">iptables</option>
                    <option value="iptraf-ng">iptraf-ng</option>
                    <option value="iputils">iputils (ping, traceroute)</option>
                    <option value="ipvsadm">ipvsadm</option>
                    <option value="liboping">liboping (oping)</option>
                    <option value="mii-tool">mii-tool</option>
                    <option value="mtr">mtr</option>
                    <option value="net-snmp-tools">net-snmp-tools (snmpget)</option>
                    <option value="netcat-openbsd">netcat-openbsd (nc)</option>
                    <option value="netgen">netgen</option>
                    <option value="nftables">nftables (nft)</option>
                    <option value="ngrep">ngrep</option>
                    <option value="nmap">nmap</option>
                    <option value="nmap-nping">nmap-nping (nping)</option>
                    <option value="scapy">scapy</option>
                    <option value="socat">socat</option>
                    <option value="strace">strace</option>
                    <option value="tcpdump">tcpdump</option>
                    <option value="tcptraceroute">tcptraceroute</option>
                    <option value="termshark">termshark</option>
                    <option value="tshark">tshark</option>
                    <option value="websocat">websocat</option>
                </optgroup>
                <optgroup label="File & Text Processing">
                    <option value="awk">awk</option>
                    <option value="cut">cut</option>
                    <option value="diff">diff</option>
                    <option value="file">file</option>
                    <option value="find">find</option>
                    <option value="grep">grep</option>
                    <option value="jq">jq (JSON processor)</option>
                    <option value="sed">sed</option>
                    <option value="vi">vi</option>
                    <option value="vim">vim</option>
                    <option value="wc">wc</option>
                    <option value="gzip">gzip</option>
                    <option value="cpio">cpio</option>
                    <option value="tar">tar</option>
                </optgroup>
                <optgroup label="System & Development">
                    <option value="bash">bash</option>
                    <option value="git">git</option>
                    <option value="libc6-compat">libc6-compat (ldd)</option>
                    <option value="openssl">openssl</option>
                    <option value="py-crypto">py-crypto</option>
                    <option value="py2-virtualenv">py2-virtualenv (virtualenv)</option>
                    <option value="python2">python2</option>
                    <option value="python3">python3</option>
                    <option value="util-linux">util-linux (lsblk, mount)</option>
                </optgroup>
                <optgroup label="Web & Transfer Tools">
                    <option value="curl">curl</option>
                    <option value="wget">wget</option>
                    <option value="dig">dig</option>
                    <option value="nslookup">nslookup</option>
                    <option value="telnet">telnet</option>
                    <option value="ssh">ssh</option>
                    <option value="lftp">lftp</option>
                    <option value="rsync">rsync</option>
                    <option value="scp">scp</option>
                    <option value="ab">ApacheBench (ab)</option>
                </optgroup>
                <optgroup label="Database Clients">
                    <option value="mysql">mysql</option>
                    <option value="psql">psql (PostgreSQL)</option>
                    <option value="mongo">mongo (MongoDB)</option>
                    <option value="redis-cli">redis-cli</option>
                </optgroup>
            </select>
            <label for="args">Arguments:</label>
            <input type="text" id="args" name="args" placeholder="e.g. -c 4 google.com">
            <div style="font-size:0.9em; color:#888; margin-bottom:1em;" id="example"></div>
            <button type="submit">Run Tool</button>
        </form>
        <div id="tool-output" class="output"></div>
    </div>
    <script>
        function updateCommandExample() {
            var tool = document.getElementById('tool').value;
            var example = '';
            switch(tool) {
                case 'ping': example = 'ping -c 4 google.com'; break;
                case 'curl': example = 'curl https://api.github.com'; break;
                case 'traceroute': example = 'traceroute google.com'; break;
                case 'tcpdump': example = 'tcpdump -i eth0'; break;
                case 'awk': example = "awk '{print $1}' file.txt"; break;
                case 'grep': example = 'grep pattern file.txt'; break;
                case 'nmap': example = 'nmap 8.8.8.8'; break;
                case 'ssh': example = 'ssh user@host'; break;
                case 'mysql': example = 'mysql -h host -u user -p'; break;
                case 'psql': example = 'psql -h host -U user'; break;
                case 'ab': example = 'ab -n 100 -c 10 http://host/'; break;
                case 'apache2-utils': example = 'ab -n 100 -c 10 http://host/'; break;
                case 'arping': example = 'arping -c 4 192.168.1.1'; break;
                case 'bash': example = 'bash -c "echo Hello World"'; break;
                case 'bind-tools': example = 'dig google.com'; break;
                case 'bird': example = 'bird -c /etc/bird.conf'; break;
                case 'bridge-utils': example = 'brctl show'; break;
                case 'busybox': example = 'busybox --list'; break;
                case 'busybox-extras': example = 'busybox-extras --list'; break;
                case 'calicoctl': example = 'calicoctl node status'; break;
                case 'conntrack-tools': example = 'conntrack -L'; break;
                case 'ctop': example = 'ctop'; break;
                case 'dhcping': example = 'dhcping -s 192.168.1.1'; break;
                case 'drill': example = 'drill google.com'; break;
                case 'ethtool': example = 'ethtool eth0'; break;
                case 'file': example = 'file /bin/bash'; break;
                case 'fping': example = 'fping 8.8.8.8'; break;
                case 'httpie': example = 'http GET https://api.github.com'; break;
                case 'iftop': example = 'iftop -i eth0'; break;
                case 'iperf': example = 'iperf -c server'; break;
                case 'iperf3': example = 'iperf3 -c server'; break;
                case 'iproute2': example = 'ip addr'; break;
                case 'ipset': example = 'ipset list'; break;
                case 'iptables': example = 'iptables -L'; break;
                case 'iptraf-ng': example = 'iptraf-ng'; break;
                case 'iputils': example = 'ping 8.8.8.8'; break;
                case 'ipvsadm': example = 'ipvsadm -L -n'; break;
                case 'jq': example = 'jq . file.json'; break;
                case 'libc6-compat': example = 'ldd --version'; break;
                case 'liboping': example = 'oping 8.8.8.8'; break;
                case 'mii-tool': example = 'mii-tool eth0'; break;
                case 'mtr': example = 'mtr google.com'; break;
                case 'net-snmp-tools': example = 'snmpget --version'; break;
                case 'netcat-openbsd': example = 'nc -zv host 80'; break;
                case 'netgen': example = 'netgen -batch'; break;
                case 'nftables': example = 'nft list ruleset'; break;
                case 'ngrep': example = 'ngrep -d eth0 port 80'; break;
                case 'nmap-nping': example = 'nping --tcp google.com'; break;
                case 'openssl': example = 'openssl version'; break;
                case 'py-crypto': example = 'python2 -c "import Crypto"'; break;
                case 'py2-virtualenv': example = 'virtualenv venv'; break;
                case 'python2': example = 'python2 --version'; break;
                case 'python3': example = 'python3 --version'; break;
                case 'scapy': example = 'scapy'; break;
                case 'socat': example = 'socat TCP4-LISTEN:1234,reuseaddr,fork EXEC:/bin/cat'; break;
                case 'strace': example = 'strace ls'; break;
                case 'termshark': example = 'termshark -i eth0'; break;
                case 'tshark': example = 'tshark -i eth0'; break;
                case 'util-linux': example = 'lsblk'; break;
                case 'vim': example = 'vim file.txt'; break;
                case 'websocat': example = 'websocat ws://echo.websocket.org'; break;
                case 'git': example = 'git status'; break;
                case 'wget': example = 'wget https://example.com/file.zip'; break;
                case 'dig': example = 'dig google.com'; break;
                case 'telnet': example = 'telnet host 80'; break;
                case 'lftp': example = 'lftp ftp://host'; break;
                case 'rsync': example = 'rsync -avz source/ dest/'; break;
                case 'scp': example = 'scp file user@host:/path'; break;
                case 'mongo': example = 'mongo --host localhost'; break;
                case 'redis-cli': example = 'redis-cli ping'; break;
                case 'cut': example = 'cut -d, -f1 file.csv'; break;
                case 'diff': example = 'diff file1.txt file2.txt'; break;
                case 'find': example = 'find . -name "*.txt"'; break;
                case 'sed': example = 'sed "s/old/new/g" file.txt'; break;
                case 'vi': example = 'vi file.txt'; break;
                case 'wc': example = 'wc -l file.txt'; break;
                case 'gzip': example = 'gzip file.txt'; break;
                case 'cpio': example = 'cpio -o < files.list > archive.cpio'; break;
                case 'tar': example = 'tar -czf archive.tar.gz files/'; break;
                default: example = tool + ' [args]';
            }
            document.getElementById('example').innerText = 'Example: ' + example;
        }
        updateCommandExample();
    </script>
    <div class="section">
        <h2>Curl/GraphQL Test</h2>
        <form hx-post="/api/curl" hx-target="#curl-output" hx-swap="innerHTML">
            <label for="url">URL:</label>
            <input type="text" id="url" name="url" placeholder="e.g. https://api.github.com">
            <label for="graphql">GraphQL Query (optional):</label>
            <textarea id="graphql" name="graphql" rows="4" placeholder="{ user(login: \"octocat\") { name } }"></textarea>
            <button type="submit">Test</button>
        </form>
        <div id="curl-output" class="output"></div>
    </div>
    <div class="section">
        <h2>Network Info</h2>
        <form hx-post="/api/network" hx-target="#network-output" hx-swap="innerHTML">
            <label for="host">Host/IP:</label>
            <input type="text" id="host" name="host" placeholder="e.g. 8.8.8.8 or google.com">
            <button type="submit">Get Info</button>
        </form>
        <div id="network-output" class="output"></div>
    </div>
</body>
</html>
